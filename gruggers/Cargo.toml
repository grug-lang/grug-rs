[package]
name = "gruggers"
version = "0.9.2"
edition = "2024"
authors = ["Nikhil Nathanael Ilango"]
description = "rust implementation of the grug language"
repository = "https://github.com/grug-lang/grug-rs"
license = "MIT"
default-run = "grugc"

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
name = "grugc"
path = "src/main.rs"

[dependencies]
json = "0.12.4"
allocator-api2 = "0.4.0"
gruggers-core = {version = "0.9.1", path = "../gruggers-core"}

[features]
generics = ["gruggers-core/generics"]

[[test]]
name = "grug_tests"
harness = false

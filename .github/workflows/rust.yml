name: Rust

on:
  push:
    branches: [ "master", "workflow_test" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      # The toolchain is pinned so a new stable cannot fail this job on its own.
      # The runner images move to the next stable within days of its release, and a
      # new lint under `-D warnings` then breaks a commit that did not change:
      # 1.99.0's clippy::nonnull_unchecked_on_box_ptr did exactly that, on two lines
      # that predate it. Bump this deliberately, fixing what the new toolchain
      # reports in the same change.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.98.1
          rustc --version
      - run: git submodule update --init --force
      - run: cmake -S gruggers/src/grug-tests/ -B ./gruggers/src/grug-tests/build/ -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build ./gruggers/src/grug-tests/build
      - run: cmake -S gruggers/src/grug-bench/ -B ./gruggers/src/grug-bench/build/ -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build ./gruggers/src/grug-bench/build

      - name: Lint with clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run unit tests
        run: cargo test --verbose --lib --bins

      - name: Run doc tests
        run: cargo test --verbose --doc

      - name: Run grug_bench
        run: cargo test --verbose --test grug_bench

      - name: Run grug_tests integration suite
        run: cargo test --verbose --test grug_tests -- --continue-on-fail
